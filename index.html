<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#020617">
    <title>PROJECT: TITAN | Premium Fitness Tracker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        titan: {
                            bg: '#020617',      // Slate 950
                            panel: '#0f172a',   // Slate 900
                            card: '#1e293b',    // Slate 800
                            border: '#334155',  // Slate 700
                            primary: '#06b6d4', // Cyan 500
                            primaryHover: '#0891b2', 
                            accent: '#3b82f6',  // Blue 500
                            success: '#10b981', // Emerald 500
                            danger: '#ef4444',  // Red 500
                            textMain: '#f8fafc',
                            textMuted: '#94a3b8'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Rajdhani', 'sans-serif'],
                    }
                }
            }
        }

    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar { width: 0px; background: transparent; }

        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(51, 65, 85, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .fitness-button { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .fitness-button:active { transform: scale(0.96); }

        .progress-ring__circle {
            transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        .checkbox-custom:checked + label .checkbox-box {
            background-color: #10b981;
            border-color: #10b981;
        }
        .checkbox-custom:checked + label .checkbox-box i { display: block; color: white; }

        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(12px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .rest-timer-active { animation: glowPulse 2s infinite; }
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 10px rgba(6, 182, 212, 0.3); border-color: rgba(6, 182, 212, 0.5); }
            50% { box-shadow: 0 0 20px rgba(6, 182, 212, 0.6); border-color: rgba(6, 182, 212, 1); }
        }

        #toast-container { z-index: 1000; }
        
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
    </style>
</head>
<body class="antialiased flex flex-col h-screen overflow-hidden selection:bg-titan-primary selection:text-white">

        class StateManager {
            constructor() {
                this.storageKey = 'titan_premium_data_v4';
                this.today = new Date().toISOString().split('T')[0];
                this.state = this.loadState();
                this.ensureDailyInit();
            }

            loadState() {
                const saved = localStorage.getItem(this.storageKey);
                if (saved) {
                    try { 
                        const parsed = JSON.parse(saved); 
                        if (parsed.meals === undefined) parsed.meals = [];
                        if (parsed.habitStreaks === undefined) parsed.habitStreaks = {};
                        if (parsed.weeklyCheckIns === undefined) parsed.weeklyCheckIns = [];
                        if (parsed.steps === undefined) parsed.steps = {};
                        if (parsed.sleepHours === undefined) parsed.sleepHours = {};
                        if (parsed.notes === undefined) parsed.notes = {};
                        if (parsed.bwAvg7d === undefined) parsed.bwAvg7d = null;
                        return parsed;
                    } catch(e) { console.error('Reset', e); }
                }
                return {
                    startDate: this.today,
                    dailyLogs: {},
                    weeklyWeights: [],
                    personalRecords: {}, 
                    streak: 0,
                    lastActive: null,
                    meals: [],
                    habitStreaks: {},
                    weeklyCheckIns: [],
                    steps: {},
                    sleepHours: {},
                    notes: {},
                    bwAvg7d: null,
                    stepsTarget: 8000,
                    sleepTarget: 7
                };
            }

            saveState() { localStorage.setItem(this.storageKey, JSON.stringify(this.state)); }

            ensureDailyInit() {
                if (!this.state.dailyLogs[this.today]) {
                    this.state.dailyLogs[this.today] = {
                        date: this.today,
                        macros: { calories: 0, protein: 0, water: 0, creatine: 0 },
                        checklist: { water: false, creatine: false, sleep7: false, vacuums: false, workout: false, weighIn: false, sunlight: false, protein: false, steps: false, noPhone: false },
                        workoutData: {}, notes: '', _streakCounted: false
                    };
                    if (this.state.lastActive && this.state.lastActive !== this.today) {
                        const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
                        if (this.state.lastActive !== yesterday.toISOString().split('T')[0]) this.state.streak = 0;
                    }
                    this.state.lastActive = this.today;
                    this.saveState();
                }
            }

            getTodayData() { return this.state.dailyLogs[this.today]; }
            updateMacro(t, v) { this.state.dailyLogs[this.today].macros[t] = parseFloat(v) || 0; this.saveState(); }
            
            toggleChecklist(item) {
                const val = !this.state.dailyLogs[this.today].checklist[item];
                this.state.dailyLogs[this.today].checklist[item] = val;
                this.saveState();
                return val;
            }

            logExerciseSet(exId, setIdx, reps, weight) {
                if (!this.state.dailyLogs[this.today].workoutData[exId]) this.state.dailyLogs[this.today].workoutData[exId] = {};
                const entry = { reps: parseInt(reps) || 0, weight: parseFloat(weight) || 0 };
                this.state.dailyLogs[this.today].workoutData[exId][setIdx] = entry;

                const pr = this.state.personalRecords[exId];
                const volume = entry.reps * (entry.weight || 1);
                const prVolume = pr ? pr.reps * (pr.weight || 1) : 0;
                
                if (!pr || volume > prVolume) {
                    this.state.personalRecords[exId] = { ...entry, date: this.today };
                }
                this.saveState();
            }

            getExerciseLog(exId) { return this.state.dailyLogs[this.today].workoutData[exId] || {}; }
            
            getLastSession(exId) {
                const dates = Object.keys(this.state.dailyLogs).sort().reverse();
                for (const d of dates) {
                    if (d === this.today) continue;
                    const log = this.state.dailyLogs[d].workoutData[exId];
                    if (log && Object.keys(log).length > 0) return log;
                }
                return null;
            }

            logBodyWeight(kg) {
                const num = parseFloat(kg);
                if (isNaN(num) || num < 30 || num > 250) return;
                this.state.weeklyWeights.push({ date: this.today, weight: num });
                this.saveState();
            }

            getWeekNumber() {
                const start = new Date(this.state.startDate);
                const diffDays = Math.ceil(Math.abs(new Date() - start) / (1000 * 60 * 60 * 24));
                return Math.floor((diffDays - 1) / 7) + 1;
            }
            
            isDeloadWeek() { return this.getWeekNumber() % MASTER_PLAN.cycle.deloadEvery === 0; }

            exportData() {
                try {
                    const dataStr = JSON.stringify(this.state, null, 2);
                    const blob = new Blob([dataStr], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `titan_backup_${this.today}.json`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                } catch(e) {
                    console.error('Export failed', e);
                    alert('Export failed. Check console.');
                }
            }

            updateHabitStreaks() {
                const today = this.today;
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                const yStr = yesterday.toISOString().split('T')[0];
                
                HABIT_SYSTEM.dailyHabits.forEach(habit => {
                    const todayDone = this.state.dailyLogs[today]?.checklist?.[habit.id];
                    const yesterdayDone = this.state.dailyLogs[yStr]?.checklist?.[habit.id];
                    
                    if (!this.state.habitStreaks[habit.id]) this.state.habitStreaks[habit.id] = 0;
                    
                    if (todayDone) {
                        if (yesterdayDone) {
                            if (!this.state.dailyLogs[today]._streakCounted) {
                                this.state.habitStreaks[habit.id]++;
                            }
                        } else {
                            this.state.habitStreaks[habit.id] = 1;
                        }
                    }
                });
                this.state.dailyLogs[today]._streakCounted = true;
                this.saveState();
            }

            getHabitStreak(habitId) { return this.state.habitStreaks[habitId] || 0; }

            addMeal(name, protein, calories, emoji = '🍽️') {
                this.state.meals.push({
                    id: 'meal_' + Date.now() + Math.random(),
                    name, protein: parseFloat(protein) || 0, calories: parseFloat(calories) || 0,
                    emoji, date: this.today, time: new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })
                });
                
                const today = this.getTodayData();
                today.macros.protein = (today.macros.protein || 0) + parseFloat(protein || 0);
                today.macros.calories = (today.macros.calories || 0) + parseFloat(calories || 0);
                
                if (today.macros.protein >= MASTER_PLAN.targets.protein) {
                    if (!today.checklist.protein) today.checklist.protein = true;
                }
                
                this.updateHabitStreaks();
                this.saveState();
            }

            removeMeal(mealId) {
                const meal = this.state.meals.find(m => m.id === mealId);
                if (!meal) return;
                this.state.meals = this.state.meals.filter(m => m.id !== mealId);
                const today = this.getTodayData();
                today.macros.protein = Math.max(0, (today.macros.protein || 0) - meal.protein);
                today.macros.calories = Math.max(0, (today.macros.calories || 0) - meal.calories);
                this.saveState();
            }

            getTodayMeals() { return this.state.meals.filter(m => m.date === this.today); }

            logSteps(count) {
                this.state.steps[this.today] = parseInt(count) || 0;
                if (parseInt(count) >= this.state.stepsTarget) {
                    if (!this.state.dailyLogs[this.today].checklist.steps) {
                        this.state.dailyLogs[this.today].checklist.steps = true;
                        this.updateHabitStreaks();
                    }
                }
                this.saveState();
            }

            logSleep(hours) {
                const h = parseFloat(hours);
                if (isNaN(h) || h < 0 || h > 16) return;
                this.state.sleepHours[this.today] = h;
                if (h >= this.state.sleepTarget) {
                    if (!this.state.dailyLogs[this.today].checklist.sleep7) {
                        this.state.dailyLogs[this.today].checklist.sleep7 = true;
                        this.updateHabitStreaks();
                    }
                }
                this.saveState();
            }

            get7DayAvgWeight() {
                const sorted = [...this.state.weeklyWeights].sort((a,b) => a.date.localeCompare(b.date));
                const last7 = sorted.slice(-7);
                if (last7.length === 0) return null;
                const avg = last7.reduce((sum, w) => sum + w.weight, 0) / last7.length;
                this.state.bwAvg7d = parseFloat(avg.toFixed(2));
                return this.state.bwAvg7d;
            }

            getWeeklyWeightChange() {
                const sorted = [...this.state.weeklyWeights].sort((a,b) => a.date.localeCompare(b.date));
                if (sorted.length < 2) return null;
                const last7 = sorted.slice(-7);
                const prev7 = sorted.slice(-14, -7);
                if (prev7.length === 0) return null;
                const avgLast = last7.reduce((s, w) => s + w.weight, 0) / last7.length;
                const avgPrev = prev7.reduce((s, w) => s + w.weight, 0) / prev7.length;
                return parseFloat((avgLast - avgPrev).toFixed(2));
            }

            checkFatigue() {
                const recent = this.state.weeklyCheckIns.slice(-2);
                if (recent.length < 2) return { status: 'unknown', message: 'Need more data', warnings: [] };
                const latest = recent[recent.length - 1].answers;
                const warnings = [];
                if (latest.sleepQuality === 'Poor') warnings.push('Sleep quality low');
                if (latest.motivation === 'Low') warnings.push('Motivation dropping');
                if (latest.jointPain === 'Moderate' || latest.jointPain === 'Significant') warnings.push('Joint pain');
                
                if (warnings.length >= 2) return { status: 'deload', message: 'Consider deload week', warnings };
                if (warnings.length === 1) return { status: 'caution', message: 'Monitor recovery', warnings };
                return { status: 'optimal', message: 'Recovery on track', warnings: [] };
            }

            getOverloadSuggestion(exerciseId, targetReps) {
                const lastSession = this.getLastSession(exerciseId);
                if (!lastSession) return null;
                const sets = Object.values(lastSession).filter(s => s.reps > 0);
                if (sets.length === 0) return null;
                
                const avgReps = sets.reduce((s, x) => s + x.reps, 0) / sets.length;
                const maxWeight = Math.max(...sets.map(s => s.weight || 0));
                const targetMatch = String(targetReps).match(/\d+/g);
                const targetMax = targetMatch ? parseInt(targetMatch[targetMatch.length - 1]) : 12;
                
                if (avgReps >= targetMax) {
                    if (maxWeight > 0) return { type: 'weight', message: `Add 2.5kg → ${maxWeight + 2.5}kg` };
                    return { type: 'reps', message: 'Add 1-2 reps or advance to harder variation' };
                }
                return { type: 'reps', message: `Aim for ${Math.min(Math.ceil(avgReps) + 2, targetMax)} reps` };
            }
        }

            playBeep(frequency = 880, duration = 200) {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = frequency;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration/1000);
                    osc.start();
                    osc.stop(ctx.currentTime + duration/1000);
                } catch(e) { /* silent fail */ }
            }

            quickAddWater(amount) {
                const current = this.state.getTodayData().macros.water || 0;

                const dashWater = document.getElementById('dash-water');
                if (dashWater) dashWater.textContent = `${newVal.toFixed(2)}L`;
                this.showToast(`Water: ${newVal.toFixed(2)}L`, 'info');
            }

            quickAddCreatine() {

            createProgressRing(label, current, max, percent, color) {

                const offset = circumference - (percent / 100) * circumference;
                return `

                        <div class="relative w-[100px] h-[100px] flex items-center justify-center">

                document.getElementById('modal-title').textContent = exercise.name;

                this.stopRestTimer();

                const display = document.getElementById('timer-display');
                el.classList.remove('hidden');
                let remaining = seconds;
                const update = () => {
                    const m = Math.floor(remaining / 60);
                    const s = remaining % 60;
                    display.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                    if (remaining <= 0) {
                        this.stopRestTimer();
                        this.showToast('Rest complete. Execute next set.', 'success');
                        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                        this.playBeep(880, 200);
                        setTimeout(() => this.playBeep(1100, 300), 250);
                    }
                    remaining--;
                };
                update();
                this.restTimerInterval = setInterval(update, 1000);
            }

                        <div class="glass-panel p-5 rounded-2xl bg-titan-card border-l-4 border-l-titan-accent">
                            <h2 class="text-sm font-display font-bold text-white uppercase tracking-wider mb-1">Surplus Required</h2>
                            <p class="text-xs text-titan-textMuted leading-relaxed">Target: Lean Bulk. Consistent surplus is mandatory for tissue generation.</p>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="glass-panel p-4 rounded-2xl flex flex-col items-center border border-titan-border bg-titan-panel">
                                <div class="w-10 h-10 rounded-full bg-titan-accent/10 flex items-center justify-center mb-3"><i class="fa-solid fa-fire text-titan-accent text-lg"></i></div>
                                <span class="text-[10px] font-bold text-titan-textMuted uppercase tracking-widest mb-2">Calories</span>
                                <input type="number" inputmode="numeric" id="input-kcal" value="${today.macros.calories || ''}" placeholder="2650" class="w-full bg-titan-card border border-titan-border rounded-xl p-2 text-center text-xl font-display font-bold text-white focus:outline-none focus:border-titan-accent mb-2">
                                <span class="text-[9px] font-bold text-titan-textMuted uppercase tracking-widest">Goal: ${MASTER_PLAN.targets.calories}</span>
                            </div>
                            <div class="glass-panel p-4 rounded-2xl flex flex-col items-center border border-titan-border bg-titan-panel">
                                <div class="w-10 h-10 rounded-full bg-titan-primary/10 flex items-center justify-center mb-3"><i class="fa-solid fa-drumstick-bite text-titan-primary text-lg"></i></div>
                                <span class="text-[10px] font-bold text-titan-textMuted uppercase tracking-widest mb-2">Protein (g)</span>
                                <input type="number" inputmode="numeric" id="input-pro" value="${today.macros.protein || ''}" placeholder="140" class="w-full bg-titan-card border border-titan-border rounded-xl p-2 text-center text-xl font-display font-bold text-white focus:outline-none focus:border-titan-primary mb-2">
                                <span class="text-[9px] font-bold text-titan-textMuted uppercase tracking-widest">Goal: ${MASTER_PLAN.targets.protein}g</span>
                            </div>
                        </div>
                        <button onclick="app.saveNutrition()" class="fitness-button w-full bg-titan-primary text-titan-bg py-4 rounded-2xl font-bold uppercase tracking-widest shadow-lg shadow-titan-primary/20 hover:bg-titan-primaryHover">Save Fuel Data</button>
                        
                        <div class="glass-panel p-5 rounded-2xl bg-titan-card">
                             <h3 class="text-[10px] font-bold text-titan-textMuted uppercase tracking-widest mb-3 border-b border-titan-border pb-2">Secondary Macros</h3>
                             <div class="flex justify-between items-center py-2"><span class="text-sm font-medium text-titan-textMain">Carbohydrates</span><span class="text-sm font-display font-bold text-white">${MASTER_PLAN.targets.carbs}g</span></div>
                             <div class="flex justify-between items-center py-2 border-t border-titan-border/50"><span class="text-sm font-medium text-titan-textMain">Dietary Fats</span><span class="text-sm font-display font-bold text-white">${MASTER_PLAN.targets.fats}g</span></div>
                        </div>
                    </div>
                `;
            }

            saveNutrition() {
                this.state.updateMacro('calories', document.getElementById('input-kcal').value);
                this.state.updateMacro('protein', document.getElementById('input-pro').value);
                this.showToast('Nutrition sync complete.', 'success');
            }

            renderProgress(container) {
                const weights = this.state.state.weeklyWeights;
                const prs = this.state.state.personalRecords;
                const avg7d = this.state.get7DayAvgWeight();
                const weeklyChange = this.state.getWeeklyWeightChange();
                const fatigue = this.state.checkFatigue();
                
                const workoutDays = Object.values(this.state.state.dailyLogs).filter(d => d.checklist?.workout).length;
                let totalVolume = 0;
                Object.values(this.state.state.dailyLogs).forEach(log => {
                    Object.values(log.workoutData).forEach(ex => {
                        Object.values(ex).forEach(set => { totalVolume += (set.reps || 0) * (set.weight || 0); });
                    });
                });

                const habitCompletion = {};
                HABIT_SYSTEM.dailyHabits.forEach(h => {
                    const days = Object.values(this.state.state.dailyLogs).filter(d => d.checklist?.[h.id]).length;
                    habitCompletion[h.id] = { name: h.name, days, streak: this.state.getHabitStreak(h.id) };
                });

                let chartHtml = weights.length >= 2 
                    ? `<canvas id="weightChart" height="220" class="w-full"></canvas>` 
                    : `<div class="text-center text-sm text-titan-textMuted py-10 flex flex-col items-center"><div class="w-16 h-16 rounded-full bg-titan-panel border border-titan-border flex items-center justify-center mb-4"><i class="fa-solid fa-chart-line text-2xl text-titan-border"></i></div>Log bodyweight for 2+ days to see trend.</div>`;

                let fatigueBanner = '';
                if (fatigue.status === 'deload') {
                    fatigueBanner = `<div class="glass-panel p-4 rounded-2xl bg-titan-danger/5 border border-titan-danger/30"><div class="flex items-start gap-3"><i class="fa-solid fa-triangle-exclamation text-titan-danger mt-0.5"></i><div class="text-xs text-titan-textMain"><strong class="text-titan-danger">Deload Recommended:</strong> ${fatigue.warnings.join(', ')}. Reduce volume 50% this week.</div></div></div>`;
                } else if (fatigue.status === 'caution') {
                    fatigueBanner = `<div class="glass-panel p-4 rounded-2xl bg-yellow-500/5 border border-yellow-500/30"><div class="flex items-start gap-3"><i class="fa-solid fa-eye text-yellow-500 mt-0.5"></i><div class="text-xs text-titan-textMain"><strong class="text-yellow-500">Monitor:</strong> ${fatigue.warnings.join(', ')}. Prioritize sleep.</div></div></div>`;
                }

                let weightInsight = '';
                if (weeklyChange !== null) {
                    if (weeklyChange > 0.5) weightInsight = `<span class="text-titan-accent font-bold">+${weeklyChange}kg/week — too fast. Reduce 200 cal.</span>`;
                    else if (weeklyChange > 0.2) weightInsight = `<span class="text-titan-success font-bold">+${weeklyChange}kg/week — ideal lean bulk.</span>`;
                    else if (weeklyChange > -0.1) weightInsight = `<span class="text-titan-textMuted font-bold">${weeklyChange}kg — stalled. Add 200 cal.</span>`;
                    else weightInsight = `<span class="text-titan-danger font-bold">${weeklyChange}kg — losing weight. Eat more.</span>`;
                }

                const allEx = {};
                Object.values(MASTER_PLAN.routine).forEach(d => d.exercises?.forEach(e => allEx[e.id] = e.name));
                const prKeys = Object.keys(prs);

                container.innerHTML = `
                    <div class="fade-in space-y-5">
                        ${fatigueBanner}
                        <div class="glass-panel p-5 rounded-2xl bg-gradient-to-br from-titan-card to-titan-panel border border-titan-primary/30">
                            <h2 class="text-[10px] font-bold text-titan-primary uppercase tracking-widest mb-3">Weekly Overview</h2>
                            <div class="grid grid-cols-3 gap-2 mb-4">
                                <div class="bg-titan-panel/60 rounded-xl p-2.5 text-center border border-titan-border/50">
                                    <div class="text-[9px] font-bold text-titan-textMuted uppercase tracking-widest">Weight</div>
                                    <div class="text-lg font-display font-bold text-white">${avg7d || '—'}</div>
                                    <div class="text-[9px] text-titan-textMuted">7-day avg</div>
                                </div>
                                <div class="bg-titan-panel/60 rounded-xl p-2.5 text-center border border-titan-border/50">
                                    <div class="text-[9px] font-bold text-titan-textMuted uppercase tracking-widest">Sessions</div>
                                    <div class="text-lg font-display font-bold text-titan-primary">${workoutDays}</div>
                                    <div class="text-[9px] text-titan-textMuted">total</div>
                                </div>
                                <div class="bg-titan-panel/60 rounded-xl p-2.5 text-center border border-titan-border/50">
                                    <div class="text-[9px] font-bold text-titan-textMuted uppercase tracking-widest">Volume</div>
                                    <div class="text-lg font-display font-bold text-titan-accent">${(totalVolume/1000).toFixed(1)}k</div>
                                    <div class="text-[9px] text-titan-textMuted">kg lifted</div>
                                </div>
                            </div>
                            ${weeklyChange !== null ? `<div class="text-[10px] text-center pt-3 border-t border-titan-border">Weekly trend: ${weightInsight}</div>` : ''}
                        </div>

                        <div class="glass-panel p-5 rounded-2xl bg-titan-card">
                            <h2 class="text-[10px] font-bold text-titan-textMuted uppercase tracking-widest border-b border-titan-border pb-2 mb-4">Mass Trajectory</h2>
                            ${chartHtml}
                        </div>

                        <div class="glass-panel p-5 rounded-2xl bg-titan-card">
                            <h2 class="text-[10px] font-bold text-titan-primary uppercase tracking-widest border-b border-titan-border pb-2 mb-3">Habit Performance</h2>
                            <div class="space-y-2">
                                ${Object.entries(habitCompletion).map(([id, data]) => `
                                    <div class="flex items-center justify-between text-xs">
                                        <span class="text-titan-textMain truncate flex-1">${data.name}</span>
                                        <div class="flex items-center gap-3 shrink-0">
                                            <span class="text-titan-textMuted">${data.days} days</span>
                                            ${data.streak > 0 ? `<span class="flex items-center gap-1 bg-titan-card px-2 py-0.5 rounded-full border border-titan-border"><i class="fa-solid fa-fire text-[9px] ${data.streak >= 7 ? 'text-orange-400' : 'text-titan-primary'}"></i><span class="font-bold ${data.streak >= 7 ? 'text-orange-400' : 'text-titan-primary'}">${data.streak}</span></span>` : ''}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="glass-panel p-5 rounded-2xl bg-titan-card">
                            <h2 class="text-[10px] font-bold text-yellow-500 uppercase tracking-widest border-b border-titan-border pb-2 mb-2 flex items-center gap-2"><i class="fa-solid fa-crown"></i> Personal Records</h2>
                            ${prKeys.length === 0 ? `<p class="text-sm text-titan-textMuted text-center py-6">No records yet. Push harder.</p>` : `<div class="space-y-1">${prKeys.map(id => `<div class="flex justify-between items-center p-3 border-b border-titan-border/50 last:border-0"><span class="text-sm font-medium text-white truncate">${allEx[id] || id}</span><div class="flex items-center gap-2 shrink-0"><span class="text-sm font-display font-bold text-titan-primary">${prs[id].reps} reps</span>${prs[id].weight ? `<span class="text-xs text-titan-textMuted">@ ${prs[id].weight}kg</span>` : ''}</div></div>`).join('')}</div>`}
                        </div>

                        <div class="glass-panel p-5 rounded-2xl bg-titan-card">
                            <h2 class="text-[10px] font-bold text-titan-textMuted uppercase tracking-widest border-b border-titan-border pb-2 mb-4">Data Management</h2>
                            <button onclick="app.state.exportData()" class="fitness-button w-full bg-titan-panel border border-titan-success text-titan-success py-3 rounded-xl font-bold text-xs uppercase tracking-widest mb-3 hover:bg-titan-success hover:text-white transition-colors"><i class="fa-solid fa-download mr-2"></i> Export Backup</button>
                            <p class="text-[10px] text-titan-textMuted text-center">Data stored locally on this device.</p>
                        </div>
                    </div>
                `;

                if (weights.length >= 2) {
                    setTimeout(() => {
                        const ctx = document.getElementById('weightChart');
                        if (ctx) {
                            new Chart(ctx, {
                                type: 'line',
                                data: { labels: weights.map(w => w.date.slice(5)), datasets: [{ label: 'KG', data: weights.map(w => w.weight), borderColor: '#06b6d4', backgroundColor: 'rgba(6, 182, 212, 0.1)', borderWidth: 2, pointBackgroundColor: '#020617', pointBorderColor: '#06b6d4', pointBorderWidth: 2, pointRadius: 4, tension: 0.4, fill: true }] },
                                options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8' } }, x: { grid: { display: false }, ticks: { color: '#94a3b8' } } } }
                            });
                        }
                    }, 50);
                }
            }

            renderPsychology(container) {
                const today = this.state.getTodayData();
                const tasksDone = Object.values(today.checklist).filter(Boolean).length;
                const isDeload = this.state.isDeloadWeek();

                let briefingTitle = "Professor's Note";
                let briefingText = tasksDone === 10 ? "All parameters met. This is how the physiological baseline shifts. Do it again tomorrow. Consistency compounds." :
                                   tasksDone === 0 ? "Awaiting input. The mind dictates the body's actions. Engage the protocol. Excuses do not generate tissue." :
                                   "Partial execution detected. Review checklist. Effort is the constant you control.";
                if (isDeload) {
                    briefingTitle = "Deload Protocol Active";
                    briefingText = "Recovery is not weakness. It is strategy. Reduce volume. Sleep more. Eat well. Return stronger next week.";
                }

                container.innerHTML = `
                    <div class="fade-in space-y-5">
                        <div class="glass-panel p-6 rounded-2xl bg-gradient-to-br from-titan-card to-titan-panel border border-titan-border relative overflow-hidden">
                            <div class="absolute -right-4 -bottom-4 opacity-5 pointer-events-none"><i class="fa-solid fa-brain text-9xl text-white"></i></div>
                            <h2 class="text-xs font-bold text-titan-primary tracking-widest uppercase mb-4 flex items-center gap-2"><i class="fa-solid fa-terminal"></i> ${briefingTitle}</h2>
                            <p class="text-sm leading-relaxed text-titan-textMain font-medium">"${briefingText}"</p>
                        </div>
                        <div class="glass-panel p-5 rounded-2xl bg-titan-card">
                            <h3 class="text-[10px] font-bold text-titan-textMuted tracking-widest uppercase border-b border-titan-border pb-2 mb-4">System Constants</h3>
                            <ul class="space-y-4 text-sm text-titan-textMuted">
                                <li class="flex gap-4 items-start"><div class="w-8 h-8 rounded-full bg-titan-panel border border-titan-border flex items-center justify-center shrink-0 mt-0.5"><i class="fa-solid fa-scale-unbalanced text-titan-primary text-xs"></i></div><div><strong class="text-white block mb-0.5">Current Phase: Lean Bulk</strong>Targeting gradual upward weight trend via 2,650 kcal continuous intake.</div></li>
                                <li class="flex gap-4 items-start"><div class="w-8 h-8 rounded-full bg-titan-panel border border-titan-border flex items-center justify-center shrink-0 mt-0.5"><i class="fa-solid fa-calendar-check text-titan-success text-xs"></i></div><div><strong class="text-white block mb-0.5">Methodology: Progressive Overload</strong>Adding reps or weight every session. Deloading every 4th week.</div></li>
                                <li class="flex gap-4 items-start"><div class="w-8 h-8 rounded-full bg-titan-panel border border-titan-border flex items-center justify-center shrink-0 mt-0.5"><i class="fa-solid fa-triangle-exclamation text-titan-accent text-xs"></i></div><div><strong class="text-white block mb-0.5">Primary Focus: V-Taper</strong>Pull-ups are mandatory (Day 2). Form strictness prioritized over volume.</div></li>
                            </ul>
                        </div>
                        <div class="pt-8">
                            <button onclick="if(confirm('Wipe ALL local data? This cannot be undone.')) { localStorage.clear(); location.reload(); }" class="w-full text-center text-[10px] font-bold text-titan-danger/50 hover:text-titan-danger uppercase tracking-widest p-3 transition-colors">[ System Wipe ]</button>
                        </div>
                    </div>
                `;
            }
        }

        // Initialize App Globally
        window.app = null;
        window.addEventListener('DOMContentLoaded', () => { window.app = new App(); });
    </script>
</body>
</html>
